name: Backend Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to proceed'
        required: true
        default: 'deploy'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 9011 }}
          script: |
            cd /opt/kitayar
            ./infra/scripts/deploy.sh backend

